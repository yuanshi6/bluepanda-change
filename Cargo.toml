[workspace]
members = ["crates/core", "crates/cli", "crates/gui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
eframe = "0.31"
fastnbt = "2"
flate2 = "1"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
